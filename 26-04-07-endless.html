<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Endless</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		.container {
			display: flex;
			flex-direction: column;
			padding: 20px;
			gap: 20px;
			align-items: center;
			overflow: scroll;
			height: 100dvh;
		}
		.container div {
			background-color: black;
			width: 100%;
			max-width: 200px;
			aspect-ratio: 1/1;
		}
	</style>
</head>
<body>
	<div class="container">
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
	</div>
	<script>
		let container = document.querySelector('.container');
		container.addEventListener('wheel', () => {
			console.log(container.scrollHeight - container.scrollTop)
			if (container.scrollHeight - container.scrollTop < window.innerHeight*2) {
				let newDiv = document.createElement('div');
				container.appendChild(newDiv);
			}
		})
	</script>
</body>
</html>
